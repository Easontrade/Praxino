name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows
        shell: pwsh
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $appId = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("$env:DANDANPLAY_APP_ID"))
          $secret = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("$env:DANDANPLAY_APP_SECRET"))
          flutter build windows --release `
            --dart-define=APP_VERSION="$version" `
            --dart-define=DANDANPLAY_APP_ID_B64="$appId" `
            --dart-define=DANDANPLAY_APP_SECRET_B64="$secret"

      - name: Test (with QuickJS DLL)
        shell: pwsh
        run: |
          $dll = Resolve-Path 'build/windows/x64/runner/Release/flutter_qjs_next_plugin.dll'
          $env:FLUTTER_QJS_NEXT_LIBRARY = $dll.Path
          flutter test

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" installer\praxino.iss

      - name: SHA256
        shell: pwsh
        run: |
          $file = Get-ChildItem dist\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content "$($file.FullName).sha256" -Encoding ascii

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
