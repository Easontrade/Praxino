name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Show build error
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Get-Content build.log -Tail 40 | ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Test (with QuickJS)
        shell: pwsh
        run: |
          $dll = Resolve-Path 'build/windows/x64/runner/Release/flutter_qjs_next_plugin.dll'
          $env:FLUTTER_QJS_NEXT_LIBRARY = $dll.Path
          flutter test

      - uses: actions/upload-artifact@v4
        with:
          name: praxino-windows-x64
          path: build/windows/x64/runner/Release/
