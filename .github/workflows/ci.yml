name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Show build error
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Get-Content build.log | Select-String -Pattern 'error|fatal|FAILED|Out of memory|LNK' -CaseSensitive:$false |
              Select-Object -Last 30 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
          }

      - name: Test (with QuickJS)
        shell: pwsh
        run: |
          $dll = Resolve-Path 'build/windows/x64/runner/Release/flutter_qjs_next_plugin.dll'
          $env:FLUTTER_QJS_NEXT_LIBRARY = $dll.Path
          flutter test

      # browser_fetch_test.dart needs WebView2, which cannot start on a hosted
      # runner (no interactive session). It is verified locally instead:
      #   .\tool\hidden_integration.ps1 -Test integration_test\browser_fetch_test.dart
      - name: Integration test (Windows)
        shell: pwsh
        run: flutter test integration_test/app_test.dart -d windows

      - uses: actions/upload-artifact@v4
        with:
          name: praxino-windows-x64
          path: build/windows/x64/runner/Release/
